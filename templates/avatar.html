<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ICE Avatar</title>
    <link rel="stylesheet" href="/static/avatar.css">
</head>
<body>
    <main id="avatarStage" class="stage emotion-neutral outfit-farmer" aria-label="ICE humanoïde boerenavatar">
        <div class="aura"></div>
        <div class="character">
            <div class="hat">
                <div class="hat-top"></div>
                <div class="hat-brim"></div>
            </div>
            <div class="head">
                <div class="hair hair-left"></div>
                <div class="hair hair-right"></div>
                <div class="temple-light"></div>
                <div class="brow brow-left"></div>
                <div class="brow brow-right"></div>
                <div class="eye eye-left"><span></span></div>
                <div class="eye eye-right"><span></span></div>
                <div class="nose"></div>
                <div class="mouth"><span></span></div>
            </div>
            <div class="neck"></div>
            <div class="torso">
                <div class="shirt shirt-left"></div>
                <div class="shirt shirt-right"></div>
                <div class="overall">
                    <div class="strap strap-left"></div>
                    <div class="strap strap-right"></div>
                    <div class="bib"><strong>ICE</strong></div>
                    <div class="pocket"></div>
                </div>
                <div class="arm arm-left"></div>
                <div class="arm arm-right"></div>
            </div>
        </div>
        <section id="caption" class="caption" aria-live="polite">
            <strong>ICE</strong>
            <span id="captionText">Farmer Cohost online</span>
        </section>
    </main>
<script src="/static/avatar.js"></script>
</body>
</html>
