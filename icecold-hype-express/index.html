<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICECOLD HYPE EXPRESS</title><style>*{box-sizing:border-box}body{margin:0;background:#071522;color:#e9faff;font-family:Arial;overflow:hidden}.track{position:absolute;top:22%;left:100%;display:flex;gap:9px;width:max-content;animation:ride 27s linear infinite}@keyframes ride{to{transform:translateX(calc(-100vw - 100%))}}.car{width:155px;height:120px;border:3px solid #b9f0ff;border-radius:30px 20px 8px 8px;background:linear-gradient(145deg,#234e68,#0b1b2c);box-shadow:inset 0 0 20px #7fdcff;position:relative;text-align:center;padding:12px}.engine{width:230px;height:142px;border-radius:75px 22px 8px 8px}.engine:before{content:"";position:absolute;width:33px;height:48px;background:#467e99;border:3px solid #b9f0ff;top:-45px;left:40px}.car:after{content:"⚙️　　　 ⚙️";position:absolute;bottom:-23px;left:12px}.avatar{display:block;margin:auto;width:56px;height:56px;border-radius:50%;border:2px solid #d7faff;background:#4d7085}.name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:10px;letter-spacing:1px;color:#bcecff}header{padding:20px;text-align:center}button{background:#b9f0ff;color:#062035;border:0;border-radius:8px;padding:12px;margin:5px;font-weight:bold}#train:empty{display:none}small{display:block;color:#9bbbc9}</style><header><h2>❄ ICECOLD HYPE EXPRESS</h2><small>Demonstratie met fictieve kijkers • geen live Twitch-verbinding</small><button onclick="demo()">▶ Demo starten</button><button onclick="addNext()">+ Wagon</button><button onclick="reset()">Reset</button></header><div id="train" class="track"></div><script>let users=[];const names=['Starter123','IceFan','SnowQueen','Frosty','TrainLover'];function avatar(n,i){const colors=['#337d9e','#8061a3','#268a83','#b16a82','#ad873f'];let svg='<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="50" fill="'+colors[i%5]+'"/><circle cx="50" cy="37" r="19" fill="#efc6a6"/><path d="M12 100Q12 64 50 64Q88 64 88 100" fill="#162a43"/></svg>';return 'data:image/svg+xml,'+encodeURIComponent(svg)}function render(){const t=document.getElementById('train');t.replaceChildren();users.forEach((n,i)=>{let c=document.createElement('div');c.className='car'+(i===0?' engine':'');let im=document.createElement('img');im.className='avatar';im.src=avatar(n,i);let tag=document.createElement('div');tag.className='tag';tag.textContent=i===0?'MACHINIST':'WAGON '+i;let label=document.createElement('div');label.className='name';label.textContent=n;c.append(im,tag,label);t.append(c)});t.style.animation='none';void t.offsetWidth;t.style.animation='ride 27s linear infinite'}function demo(){users=[...names];render()}function addNext(){if(!users.length)users=['Starter123'];users.push('Kijker'+users.length);render()}function reset(){users=[];render()}demo();</script></html>
